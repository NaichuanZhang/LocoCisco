# Sensors: USB speakerphone, USB webcam, seat zones (owner: sensors workstream; see docs/SENSORS.md).
# Everything has a default in unspoken/sensors/config.py; this file only overrides.

[audio]
device = ""                       # sounddevice input device name substring ("Jabra", "Anker"); "" = system default
alsa_device = "default"           # for the arecord fallback: "plughw:CARD=Jabra,DEV=0" (arecord -L lists them)
sample_rate = 16000
chunk_ms = 32                     # one Silero window; the capture loop never blocks longer than this
backend = "auto"                  # auto | sounddevice | arecord

[video]
device = 0                        # index, "/dev/video2", or a name substring from /sys/class/video4linux/*/name
fps = 5                           # frames we keep; the camera runs at its own rate and the rest are dropped
width = 640                       # downscale before detection (YuNet is ~15 ms at 640x360 on one core)
height = 360

[speakers]
hz = 5                            # MT.SPEAKERS rate
speaking_threshold = 0.5          # P(speaking) at or above this counts as talking (screen_talking)

# Seat zones: x, y, w, h in 0..1 of the (downscaled) frame. A face whose box lies mostly in a zone gets that
# seat id; the zone named "screen" marks the room display, so a talking face there is media, not a person.
# Rehearsal: run `python -m unspoken.sensors.replay --video clip.mp4 --audio clip.wav` and adjust until each
# chair lands in its own zone.
[seats]
s1 = [0.00, 0.25, 0.25, 0.75]
s2 = [0.25, 0.25, 0.25, 0.75]
s3 = [0.50, 0.25, 0.25, 0.75]
s4 = [0.75, 0.25, 0.25, 0.75]
screen = [0.30, 0.00, 0.40, 0.25]

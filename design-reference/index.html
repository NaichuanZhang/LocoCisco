<!doctype html>
<html lang="en">
  <head>
    <meta name="od-motion-output" content="video">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta name="od-motion-audio" content="required">
    <link rel="alternate" type="video/mp4" href="../../lococisco-intro.mp4">
    <title>LocoCisco — a satin ribbon writes the logo</title>
    <script src="./gsap.min.js"></script>
    <script>
      // Automated capture (HyperFrames CLI render) drives the timeline itself:
      // keep the preview player's autoplay and scaling out of the frames.
      if (navigator.webdriver) window.__odMotionRender = true;
    </script>
    <!-- The word's centre line, widths, folds, bars and dot, from ../tools/build-logo.mjs -->
    <script src="assets/lococisco-data.js"></script>
    <style>
      :root { --ground: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      /* Two stacked picture layers: the ribbon (canvas) and the finished logo (SVG) above it. */
      #silk, #logo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.8"
      data-fps="60"
      data-width="1920"
      data-height="1080"
      data-poster-time="4.5"
      role="img"
      aria-label="Logo intro: a satin ribbon whips in, writes LocoCisco in one joined stroke and becomes the lettering, then nine bridge bars rise above it like voice levels and settle"
    >
      <canvas id="silk" aria-hidden="true"></canvas>
      <svg id="logo" viewBox="0 0 1920 1080" aria-hidden="true">
        <defs>
          <linearGradient id="lc-grad" gradientUnits="userSpaceOnUse" y1="0" y2="0"></linearGradient>
          <linearGradient id="lc-sheen-fill" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#fff" stop-opacity="1" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </linearGradient>
          <clipPath id="lc-clip"><use href="#lc-letters" /></clipPath>
        </defs>
        <g id="lc-bars" fill="url(#lc-grad)"></g>
        <path id="lc-letters" fill="url(#lc-grad)" />
        <circle id="lc-dot" fill="url(#lc-grad)" />
        <path id="lc-gloss" fill="#fff" />
        <g clip-path="url(#lc-clip)">
          <g id="lc-sheen"><rect id="lc-sheen-band" fill="url(#lc-sheen-fill)" /></g>
        </g>
      </svg>
      <audio id="sound" class="clip" src="assets/sound.wav" data-start="0" data-duration="4.8"
             data-track-index="2" data-volume="1" preload="auto"></audio>
    </div>
    <script>
    (function () {
      const LOCO = window.LOCO;
      // ---- configuration: every timing, size and light value lives here ----
      // (../tools/make-sound.mjs reads this block too, so the sound follows any change)
      const CFG = /*@cfg*/{
        duration: 4.8,
        posterTime: 4.5,
        // Free flight before the word (stage px), smoothed through these points and on into the L's
        // entry stroke: in from off-screen right, two S-waves along the top, one loop at upper left,
        // then a hook down the left side that swings up into the L.
        flight: [[2200, 330], [1900, 190], [1640, 330], [1400, 420], [1150, 290], [900, 170], [660, 260],
                 [470, 330], [320, 270], [360, 150], [480, 170], [500, 290], [430, 420], [330, 515],
                 [243, 595], [250, 662], [326, 606]],
        ribbon: {
          start: 0, travel: 2.9, easePow: 2.2, // the tip runs flight + word on 1-(1-u)^2.2: fast whip, slowing as it writes
          width: 36,                // flat width in flight (px); its length equals the word's centre line
          widthFlow: 0.2, flowLen: 720, flowHz: 0.35, // width swells and narrows ±20 % along the band, drifting
          tailTaper: 160, tipTaper: 90, endMin: 0.35, // both ends taper to 35 % and finish in a round cap
          fillIn: 45,               // over its first 45 px on the word the band takes the letters' width and colour
          settle: [-0.05, 0.2],     // the last piece of tail settles into the L this long around the landing (s)
          twistLen: 1000, twistHz: 0.4, edgeMin: 0.5, // a soft full twist per 1000 px; never thinner than half
          backShade: 0.8, sheen: 0.38,                // back face darker; satin glint when face-on
          flutter: 16, flutterLen: 380, flutterHz: 1.3, // ripples travelling along the airborne part
          tailFlutter: 1.7, tailLen: 260, tipCalm: 200, // the free tail whips more; the tip stays steady
          landBlend: 140,                             // px before the word where ripples and twist die out
        },
        swap: 3.1,                  // the written ribbon hands over to the logo artwork (identical outline)
        gloss: { start: 3.05, dur: 0.4 },             // the artwork's satin highlights fade in
        // Nine bridge bars flicker through three voice levels, then glide together into the bridge.
        bars: {
          start: 2.95, stagger: 0.025, beats: [0.12, 0.1, 0.1], lock: 3.62,
          levels: [[0.55, 0.3, 0.8], [0.9, 0.45, 0.6], [0.7, 1, 0.4], [1, 0.55, 0.85], [0.6, 0.95, 0.5],
                   [0.85, 0.4, 0.95], [0.45, 0.8, 0.65], [0.75, 0.35, 0.9], [0.4, 0.7, 0.3]],
        },
        dot: { at: 3.3, dur: 0.3, fade: 0.1, ease: 'power3.out' },   // the i's dot
        sheen: { start: 3.4, dur: 0.5, width: 240, alpha: 0.42, skew: -18, ease: 'power2.inOut' },
      }/*@end*/;

      const RB = CFG.ribbon, TAU = Math.PI * 2;
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const smooth = (a, b, x) => { const v = clamp((x - a) / (b - a), 0, 1); return v * v * (3 - 2 * v); };
      const STEP = LOCO.step, SP = LOCO.spine, KN = SP.length;

      const canvas = document.getElementById('silk');
      const R = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
      canvas.width = 1920 * R; canvas.height = 1080 * R;
      const ctx = canvas.getContext('2d');

      // ---- the finished logo, built from the same data as ../../lococisco-logo.svg ----
      const NS = 'http://www.w3.org/2000/svg';
      const svgEl = (tag, attrs, parent) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      };
      const GRAD = LOCO.gradient, gx0 = GRAD[0][0], gx1 = GRAD[GRAD.length - 1][0];
      const gradEl = document.getElementById('lc-grad');
      gradEl.setAttribute('x1', gx0); gradEl.setAttribute('x2', gx1);
      GRAD.forEach(([x, r, g, b]) => svgEl('stop', { offset: (x - gx0) / (gx1 - gx0), 'stop-color': `rgb(${r},${g},${b})` }, gradEl));
      const lettersEl = document.getElementById('lc-letters');
      lettersEl.setAttribute('d', LOCO.letters);
      const glossEl = document.getElementById('lc-gloss');
      glossEl.setAttribute('d', LOCO.gloss);
      glossEl.setAttribute('fill-opacity', LOCO.glossAlpha);
      const dotEl = document.getElementById('lc-dot');
      dotEl.setAttribute('cx', LOCO.dot.cx); dotEl.setAttribute('cy', LOCO.dot.cy); dotEl.setAttribute('r', LOCO.dot.r);
      const barsEl = document.getElementById('lc-bars');
      const barEls = LOCO.bars.items.map((b) => svgEl('rect', { x: b.cx - b.w / 2, width: b.w, rx: b.w / 2, y: LOCO.bars.cy, height: 0 }, barsEl));
      const box = LOCO.box, SH = CFG.sheen, skewK = Math.tan(SH.skew * Math.PI / 180);
      const sheenEl = document.getElementById('lc-sheen');
      const band0 = document.getElementById('lc-sheen-band');
      [['x', 0], ['y', box.y - 10], ['width', SH.width], ['height', box.h + 20],
       ['transform', `skewX(${SH.skew})`]].forEach(([k, v]) => band0.setAttribute(k, v));
      band0.setAttribute('fill-opacity', SH.alpha);

      // ---- path: free flight + the word's centre line, one sample every STEP px ----
      function flightLine(pts, end, dir) {
        const P = pts.concat([end]), n = P.length, T = [];
        for (let i = 0; i < n; i++) {
          if (i === n - 1) { T.push(dir); continue; }
          const a = P[Math.max(0, i - 1)], b = P[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
          T.push([(b[0] - a[0]) / l, (b[1] - a[1]) / l]);
        }
        const dense = [P[0]];
        for (let i = 0; i < n - 1; i++) {
          const p0 = P[i], p3 = P[i + 1], ch = Math.hypot(p3[0] - p0[0], p3[1] - p0[1]), h = 0.36 * ch;
          const p1 = [p0[0] + T[i][0] * h, p0[1] + T[i][1] * h], p2 = [p3[0] - T[i + 1][0] * h, p3[1] - T[i + 1][1] * h];
          const m = Math.max(8, Math.ceil(ch));
          for (let k = 1; k <= m; k++) {
            const t = k / m, u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
            dense.push([a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0], a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1]]);
          }
        }
        // Even spacing (a whole number of spans of about STEP px) so the word starts on a sample.
        const cum = [0];
        for (let i = 1; i < dense.length; i++) cum.push(cum[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]));
        const L = cum[cum.length - 1], spans = Math.max(1, Math.round(L / STEP)), out = [];
        for (let k = 0, i = 1; k <= spans; k++) {
          const s = L * k / spans;
          while (i < cum.length - 1 && cum[i] < s) i++;
          const seg = cum[i] - cum[i - 1], f = seg > 0 ? (s - cum[i - 1]) / seg : 0;
          out.push([dense[i - 1][0] + (dense[i][0] - dense[i - 1][0]) * f, dense[i - 1][1] + (dense[i][1] - dense[i - 1][1]) * f]);
        }
        out[spans] = [end[0], end[1]];
        return out;
      }
      const flightPts = flightLine(CFG.flight, [LOCO.start.x, LOCO.start.y], [LOCO.start.dx, LOCO.start.dy]);
      flightPts.pop(); // the word supplies its own first point
      const pathPts = flightPts.concat(SP.map((p) => [p[0], p[1]]));
      const NP = pathPts.length;
      const PX = new Float64Array(NP), PY = new Float64Array(NP), NX = new Float64Array(NP), NY = new Float64Array(NP);
      pathPts.forEach((p, i) => { PX[i] = p[0]; PY[i] = p[1]; });
      for (let i = 0; i < NP; i++) {
        const a = Math.max(0, i - 2), b = Math.min(NP - 1, i + 2);
        const dx = PX[b] - PX[a], dy = PY[b] - PY[a], l = Math.hypot(dx, dy) || 1;
        NX[i] = -dy / l; NY[i] = dx / l;
      }
      const sLetter = flightPts.length * STEP;     // path position where the word begins
      const sEnd = (NP - 1) * STEP;
      const ribbonLen = (KN - 1) * STEP;           // exactly the word's centre line
      function pathAt(s, out) {
        const f = clamp(s / STEP, 0, NP - 1), i = Math.min(NP - 2, Math.floor(f)), k = f - i;
        out[0] = PX[i] + (PX[i + 1] - PX[i]) * k; out[1] = PY[i] + (PY[i + 1] - PY[i]) * k;
        out[2] = NX[i] + (NX[i + 1] - NX[i]) * k; out[3] = NY[i] + (NY[i + 1] - NY[i]) * k;
      }

      // Ribbon colour = the logo gradient where each piece will finally lie.
      function gradAt(x) {
        if (x <= GRAD[0][0]) return GRAD[0].slice(1);
        for (let i = 1; i < GRAD.length; i++) if (x <= GRAD[i][0]) {
          const a = GRAD[i - 1], b = GRAD[i], k = (x - a[0]) / (b[0] - a[0]);
          return [a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k, a[3] + (b[3] - a[3]) * k];
        }
        return GRAD[GRAD.length - 1].slice(1);
      }
      const COL = SP.map((p) => gradAt(p[0]));
      const letterGrad = ctx.createLinearGradient(gx0, 0, gx1, 0);
      GRAD.forEach(([x, r, g, b]) => letterGrad.addColorStop((x - gx0) / (gx1 - gx0), `rgb(${r},${g},${b})`));

      // Per-frame scratch buffers for the ribbon.
      const CX = new Float64Array(KN), CY = new Float64Array(KN), HW = new Float64Array(KN), HWP = new Float64Array(KN);
      const TX = new Float64Array(KN), TY = new Float64Array(KN), IN = new Float64Array(KN);
      const SR = new Float64Array(KN), SG = new Float64Array(KN), SB = new Float64Array(KN);
      const rgb = (k) => 'rgb(' + (SR[k] | 0) + ',' + (SG[k] | 0) + ',' + (SB[k] | 0) + ')';
      const tmp = [0, 0, 0, 0];

      // Unit tangents of the centre line; where it doubles back, keep the incoming direction.
      function tangents(k0, k1) {
        for (let k = k0; k <= k1; k++) {
          let ax = 0, ay = 0, bx = 0, by = 0, l;
          if (k > k0) { ax = CX[k] - CX[k - 1]; ay = CY[k] - CY[k - 1]; l = Math.hypot(ax, ay); if (l > 1e-9) { ax /= l; ay /= l; } else ax = ay = 0; }
          if (k < k1) { bx = CX[k + 1] - CX[k]; by = CY[k + 1] - CY[k]; l = Math.hypot(bx, by); if (l > 1e-9) { bx /= l; by /= l; } else bx = by = 0; }
          let tx = ax + bx, ty = ay + by; l = Math.hypot(tx, ty);
          if (l < 0.5) { tx = ax || bx; ty = ay || by; l = Math.hypot(tx, ty) || 1; }
          TX[k] = tx / l; TY[k] = ty / l;
        }
      }
      // The band's outline as runs of quads plus round caps, all wound one way, so where the ribbon
      // crosses or folds back over itself the pieces simply add up: ONE shape, ONE outline.
      // (Same construction as build-logo.mjs, so the written ribbon and the artwork match exactly.)
      const G = {
        moveTo: (x, y) => ctx.moveTo(x, y), lineTo: (x, y) => ctx.lineTo(x, y), closePath: () => ctx.closePath(),
        disc: (x, y, r) => { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU, false); ctx.closePath(); },
      };
      function band(g, k0, k1, W, discs) {
        const lx = (k) => CX[k] - TY[k] * W[k], ly = (k) => CY[k] + TX[k] * W[k];
        const rx = (k) => CX[k] + TY[k] * W[k], ry = (k) => CY[k] - TX[k] * W[k];
        const area3 = (ax, ay, bx, by, cx, cy) => (bx - ax) * (cy - ay) - (cx - ax) * (by - ay);
        const tri = (ax, ay, bx, by, cx, cy) => {
          g.moveTo(ax, ay);
          if (area3(ax, ay, bx, by, cx, cy) >= 0) { g.lineTo(bx, by); g.lineTo(cx, cy); } else { g.lineTo(cx, cy); g.lineTo(bx, by); }
          g.closePath();
        };
        let run = -1;
        const flush = (end) => {
          if (run < 0) return;
          g.moveTo(rx(run), ry(run));
          for (let k = run + 1; k <= end; k++) g.lineTo(rx(k), ry(k));
          for (let k = end; k >= run; k--) g.lineTo(lx(k), ly(k));
          g.closePath(); run = -1;
        };
        for (let k = k0 + 1; k <= k1; k++) {
          const a = k - 1;
          if (TX[a] * TX[k] + TY[a] * TY[k] < 0) { flush(a); continue; }
          const t1 = area3(rx(a), ry(a), rx(k), ry(k), lx(k), ly(k)), t2 = area3(rx(a), ry(a), lx(k), ly(k), lx(a), ly(a));
          if (t1 > 0 && t2 > 0) { if (run < 0) run = a; continue; }
          flush(a);
          tri(rx(a), ry(a), rx(k), ry(k), lx(k), ly(k)); tri(rx(a), ry(a), lx(k), ly(k), lx(a), ly(a));
        }
        flush(k1);
        for (const k of discs) g.disc(CX[k], CY[k], W[k]);
      }

      const easeTip = (q) => 1 - Math.pow(1 - q, RB.easePow);
      const tipEnd = RB.start + RB.travel;          // the tip lands at the end of the flourish

      function drawRibbon(t) {
        const q = clamp((t - RB.start) / RB.travel, 0, 1);
        const sTip = sEnd * easeTip(q), sTail = sTip - ribbonLen;
        let k0 = 0;
        while (k0 < KN && sTail + k0 * STEP < 0) k0++;
        if (k0 >= KN - 2) return;
        const last = KN - 1;
        const settle = smooth(tipEnd + RB.settle[0], tipEnd + RB.settle[1], t);
        const taper = (a) => RB.endMin + (1 - RB.endMin) * a;
        for (let k = k0; k <= last; k++) {
          const m = k * STEP, s = sTail + m;
          pathAt(s, tmp);
          const laid = smooth(sLetter - RB.landBlend, sLetter, s), air = 1 - laid;
          const tipCalm = smooth(0, RB.tipCalm, sTip - s);
          const tailBoost = 1 + (RB.tailFlutter - 1) * (1 - clamp(m / RB.tailLen, 0, 1));
          const off = RB.flutter * air * tipCalm * tailBoost * Math.sin(TAU * (s / RB.flutterLen - RB.flutterHz * t));
          CX[k] = tmp[0] + tmp[2] * off; CY[k] = tmp[1] + tmp[3] * off;
          // The twist eases out by blending its effect toward face-on (not its phase, which would
          // spin the band through several turns inside the landing zone).
          const c = 1 - air * (1 - Math.cos(TAU * (m / RB.twistLen + RB.twistHz * t)));
          const flow = 1 + RB.widthFlow * Math.sin(TAU * (m / RB.flowLen - RB.flowHz * t));
          // Twist narrows the band through cos² (smooth through edge-on, no kink in the outline).
          const airHW = RB.width / 2 * flow * (RB.edgeMin + (1 - RB.edgeMin) * c * c);
          // On the word the band takes the letters' own width, so the ribbon becomes the lettering.
          const j = clamp(Math.round((s - sLetter) / STEP), 0, KN - 1);
          const inLetter = s >= sLetter ? Math.max(smooth(sLetter, sLetter + RB.fillIn, s), settle) : 0;
          const ends = taper(smooth(0, RB.tailTaper, m)) * taper(smooth(0, RB.tipTaper, ribbonLen - m));
          const endK = ends + (1 - ends) * inLetter;
          IN[k] = inLetter;
          HW[k] = endK * (airHW + (SP[j][2] - airHW) * inLetter);
          // Front and back faces blend smoothly instead of switching at a hard crease.
          const face = RB.backShade + (1 - RB.backShade) * smooth(-0.35, 0.35, c);
          const spec = air * RB.sheen * Math.pow(Math.max(0, c), 6);
          const ck = COL[k], cj = COL[j], lum = face * (0.86 + 0.14 * c * c * air + 0.14 * laid);
          const br = ck[0] + (cj[0] - ck[0]) * inLetter, bg = ck[1] + (cj[1] - ck[1]) * inLetter, bb = ck[2] + (cj[2] - ck[2]) * inLetter;
          SR[k] = br * lum + (255 - br * lum) * spec;
          SG[k] = bg * lum + (255 - bg * lum) * spec;
          SB[k] = bb * lum + (255 - bb * lum) * spec;
        }
        tangents(k0, last);
        // Round caps at both ends, and round folds where the word doubles back under the ribbon.
        const discs = [k0, last], shift = (sLetter - sTail) / STEP;
        for (const jf of LOCO.folds) { const kf = Math.round(jf + shift); if (kf > k0 && kf < last) discs.push(kf); }

        // The band's outline is one clip path; its colour is painted inside it.
        ctx.save();
        ctx.beginPath();
        band(G, k0, last, HW, discs);
        ctx.clip();
        // In the air: one colour per slice (twist shading), slices slightly wider than the band and
        // overlapping, so only the clip shows as an edge.
        const pad = 1.5, back = 1.2;
        let px0 = 0, py0 = 0, qx0 = 0, qy0 = 0, firstLaid = -1;
        for (let k = k0; k <= last; k++) {
          const w = HW[k] + pad;
          const lx = CX[k] - TY[k] * w, ly = CY[k] + TX[k] * w, rx = CX[k] + TY[k] * w, ry = CY[k] - TX[k] * w;
          if (IN[k] >= 0.5 && firstLaid < 0) firstLaid = k;
          if (k === k0) {
            if (IN[k] < 0.5) { ctx.beginPath(); ctx.arc(CX[k], CY[k], HW[k] + pad + 1, 0, TAU); ctx.fillStyle = rgb(k); ctx.fill(); }
          } else if (IN[k - 1] < 0.5) {
            const bx = TX[k] * back, by = TY[k] * back;
            ctx.beginPath();
            ctx.moveTo(px0 - bx, py0 - by); ctx.lineTo(lx, ly); ctx.lineTo(rx, ry); ctx.lineTo(qx0 - bx, qy0 - by); ctx.closePath();
            ctx.fillStyle = rgb(k); ctx.fill();
          }
          px0 = lx; py0 = ly; qx0 = rx; qy0 = ry;
        }
        if (firstLaid < 0) { ctx.beginPath(); ctx.arc(CX[last], CY[last], HW[last] + pad + 1, 0, TAU); ctx.fillStyle = rgb(last); ctx.fill(); }
        // On the word: the letters' own gradient, filled once over every laid piece, so strokes that
        // cross or fold back carry exactly the artwork's colour with no seams.
        if (firstLaid >= 0) {
          const from = Math.max(k0, firstLaid - 1);
          for (let k = from; k <= last; k++) HWP[k] = HW[k] + pad;
          ctx.beginPath();
          band(G, from, last, HWP, discs.filter((k) => k >= from));
          ctx.fillStyle = letterGrad; ctx.fill();
        }
        ctx.restore();
      }

      function renderAt(t) {
        ctx.setTransform(R, 0, 0, R, 0, 0);
        ctx.clearRect(0, 0, 1920, 1080);
        if (t > RB.start && t < CFG.swap) drawRibbon(t);
      }

      function build() {
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: CFG.duration, duration: CFG.duration, ease: 'none' }, 0);

        // The ribbon has become the lettering: the artwork takes over, then its gloss fades in.
        tl.fromTo(lettersEl, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: 'none' }, CFG.swap);
        tl.fromTo(glossEl, { opacity: 0 }, { opacity: 1, duration: CFG.gloss.dur, ease: 'sine.inOut' }, CFG.gloss.start);

        // Bridge bars: each flickers through three voice levels, then all glide into the bridge together.
        const BA = CFG.bars, cy = LOCO.bars.cy, H = LOCO.bars.maxH;
        const hAt = (h) => ({ attr: { y: cy - h / 2, height: h } });
        barEls.forEach((el, i) => {
          const lv = BA.levels[i];
